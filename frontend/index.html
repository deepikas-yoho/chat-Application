<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chat Demo</title>
  <style>
    body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 16px;background:#f6f7fb}
    input,textarea,button{font:inherit;padding:10px;margin:5px 0}
    input,textarea{width:100%;box-sizing:border-box}
    #chat{background:white;border:1px solid #ddd;border-radius:10px;padding:16px;min-height:260px;white-space:pre-wrap}
    .user{color:#174ea6}.assistant{color:#137333}
  </style>
</head>
<body>
  <h1>AI Chat Application</h1>
  <label>API key</label><input id="key" type="password" placeholder="X-API-Key">
  <button id="create">Create session</button>
  <p id="session"></p>
  <div id="chat"></div>
  <textarea id="message" rows="3" placeholder="Type a message..."></textarea>
  <button id="send">Send</button>
  <script>
    const base = "http://127.0.0.1:8000";
    let sessionId = null;
    const headers = () => ({ "X-API-Key": document.querySelector("#key").value });
    const chat = document.querySelector("#chat");

    document.querySelector("#create").onclick = async () => {
      const r = await fetch(base + "/sessions", {method:"POST", headers:headers()});
      const data = await r.json();
      if (!r.ok) return alert(data.detail || "Could not create session");
      sessionId = data.id;
      document.querySelector("#session").textContent = "Session: " + sessionId;
      chat.textContent = "";
    };

    document.querySelector("#send").onclick = async () => {
      if (!sessionId) return alert("Create a session first");
      const box = document.querySelector("#message");
      const message = box.value.trim();
      if (!message) return;
      box.value = "";
      chat.textContent += "\nYou: " + message + "\nAI: ";
      const r = await fetch(`${base}/sessions/${sessionId}/chat`, {
        method:"POST",
        headers:{...headers(), "Content-Type":"application/json"},
        body:JSON.stringify({message})
      });
      if (!r.ok) { chat.textContent += "\n" + (await r.text()); return; }
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const {value, done} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream:true});
        const events = buffer.split("\n\n");
        buffer = events.pop();
        for (const event of events) {
          const line = event.split("\n").find(x => x.startsWith("data: "));
          if (!line) continue;
          const payload = JSON.parse(line.slice(6));
          if (payload.content) chat.textContent += payload.content;
          if (payload.error) chat.textContent += payload.error;
        }
      }
      chat.textContent += "\n";
    };
  </script>
</body>
</html>
